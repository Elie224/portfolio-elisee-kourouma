services:
  - type: web
    name: portfolio
    env: static
    buildCommand: echo "No build needed for static site"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=(), payment=(), usb=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src ''self''; script-src ''self'' ''unsafe-inline''; style-src ''self'' ''unsafe-inline''; img-src ''self'' data: https:; font-src ''self'' data:; connect-src ''self'' https://portfolio-backend-elisee.fly.dev; frame-ancestors ''none''; base-uri ''self''; form-action ''self''; object-src ''none''"
      - path: /assets/css/*
        name: Content-Type
        value: text/css; charset=utf-8
      - path: /assets/js/*
        name: Content-Type
        value: application/javascript; charset=utf-8
      - path: /assets/*.jpeg
        name: Content-Type
        value: image/jpeg
      - path: /assets/*.jpg
        name: Content-Type
        value: image/jpeg
      - path: /assets/*.png
        name: Content-Type
        value: image/png
      - path: /assets/*.pdf
        name: Content-Type
        value: application/pdf
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.html
        name: Content-Type
        value: text/html; charset=utf-8
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /admin.html
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /admin.html
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive, nosnippet
      - path: /admin.html
        name: X-Frame-Options
        value: DENY
      - path: /admin.html
        name: Referrer-Policy
        value: no-referrer
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
